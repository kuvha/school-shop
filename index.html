<!DOCTYPE html>

<html>
<head>
  <meta content="text/html; charset=UTF-8">
   <meta name="viewport"
    content="width=device-width,initial-scale=1.0"> 
  
  <link rel="stylesheet" href="layout.css"/>
  <title>SchoolStore</title>
  <style>
  
 
  </style>
</head>
<body>
  
  <main class="main">
    <header>
      <div class="headdiv"> 
      <h4 class="cartt">🛒</h4>
      <p class="total-quantity">0</p>
      <p class="total-price">R0</p>
      </div>
      
     
      
      <button onclick="
        if(cart.length>0){
        slipSet();
        }else{
        alert('cart is empty and items!');
        }
        " class="checkOutBtn">Check Out</button>
    </header>
    
      <h1 class="title">
    SchoolStore
  </h1>
    
    <div class="items-container">
      
    </div>
  </main>
  
  
  
  
  
  <script >
  const products = [
  { pic: `<img src="pen.png">`, name: "Pen", desc: "Blue Ballpoint Pen", price: 15 },
  { pic: `<img src="pencil.png">`, name: "Pencil", desc: "HB Pencil - Single", price: 10 },
  { pic:`<img src="rubber.png">`, name: "Rubber / Eraser", desc: "White Eraser - Soft", price: 12 },
  { pic: `<img src="book.png">`, name: "Book", desc: "A4 Counter Book 192pg", price: 45 },
  { pic:`<img src="sharpener.png">`, name: "Sharpener", desc: "Metal Sharpener - Single", price: 18 },
  { pic: `<img src="crayons.png">`, name: "Crayons Pack", desc: "Pack of 12 Crayons", price: 55 },
  { pic: `<img src="calculator.png">`, name: "Calculator", desc: "Scientific Calculator", price: 199 },
  { pic: `<img src="ruler.png">`, name: "Ruler", desc: "30cm Clear Ruler", price: 25 },
  { pic: `<img src="math.png">`, name: "Maths Instrument Set", desc: "Compass, Protractor, Set Squares", price: 85 },
  { pic:`<img src="mark.png">`, name: "Markers", desc: "Pack of 6 Coloured Markers", price: 65 }
];
  
  let cart = [];
  
  let items ="";
  const itemsElm = document.querySelector(".items-container");
  let totalPrice=0;
  let quantity=0;
  
 function loadItems(){
   products.forEach( function(item,index){
     addItemProperties(item.pic,item.name,item.desc,item.price,index);
   });
 }
  
  function addItemProperties(e,n,d,p,index){
    
    items = items +  `
    <div class="container">
    
        <div class="btn-item-container">
    
          <div class="item-img">${e}</div>
    
          <div class="item-info">
            <p class="Name"> ${n}</p>
            <p class="desc">${d}</p>
            <p class="price">R ${p}</p>
          </div>
    
        </div>
    
        <div class="btn-container">
    
          <button onclick="
   addToCart(${index});
    renderPQ(totalPrice,quantity);
    ">Add To Cart +</button>
    
          <button onclick="
    removeItem(${index});
    renderPQ(totalPrice,quantity);
    "> remove </button>
    
        </div>
    
      </div>
    
    `;
    
  }
  
  function renderItems(){
    itemsElm.innerHTML = items;
  }
  function renderPQ(p,q){
    document.querySelector(".total-price").innerText = "R "+p;
    document.querySelector(".total-quantity").innerText =q;
  }
  
  function removeItem(index){
    for(let i = 0; i < cart.length; i++){
      if(index===cart[i].code){
        totalPrice-=cart[i].price;
        quantity-=1;
        cart.splice(i,1);
        
        alert("item removed");
        break;
      }
    }
      renderPQ(totalPrice,quantity);
  }
  
  
  function addToCart(index){
    let p = products[index];
    p.code = index;
    cart.push(p);
    
    totalPrice=totalPrice+products[index].price;
    quantity++;
    
   
  }
  
  
  
  loadItems();
  renderItems();
  
  function  slipSet(){
    let pageHTML = `
   
   <h1>SchoolStore</h1>
  
    <h3>check out</h3>
  
    <div class="slip-container">
      
      <div class="itemstable">
    ${itemStats()}
    
      </div>
    </div>
  
  
  
    </div>
  

 <button onclick="
   alert('thank you');
   ">process payment</button>
    `;

  
  
    
    document.querySelector(".main").innerHTML= pageHTML;
    
}
function itemStats(){
  let done = [];
  let html = "";

  for(let i = 0; i < cart.length; i++){

    if(done.includes(cart[i].name)){
      continue; // already showed Pen, skip this Pen
    }

    done.push(cart[i].name);

    let num = getAmount(cart[i].name);

    html = html + `<p>${cart[i].name} </p>
    <p>${num}</p>`;
  }

  return `
    <p>total price</p><p class="price">R${totalPrice}</p>
      <p>total items</p><p class="quantity">${quantity}</p>
    
    
    <h3>name </h3><h3>quantity</h3> `+ html; 
}



function getAmount(name){
  let a = 0;
  for(let b = 0; b < cart.length; b++){
    if(name === cart[b].name){
      a++;
    }
  }
  return a;
}
  
  </script>
  
   
  
  
  
</body>
</html>
